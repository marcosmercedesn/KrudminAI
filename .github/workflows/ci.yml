name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum
            ruby: "3.3"
            rails: "~> 8.1.3"
          - name: stable
            ruby: "3.4"
            rails: ">= 8.1, < 10.0"
          - name: latest
            ruby: "4.0"
            rails: ">= 8.1, < 10.0"
          - name: preview
            ruby: head
            rails: ">= 9.0.a"
            allow_failure: true
    continue-on-error: ${{ matrix.allow_failure || false }}
    env:
      RAILS_VERSION: ${{ matrix.rails }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - run: bundle update rails erb --conservative
      - run: bundle exec rspec
      - run: bundle exec rubocop